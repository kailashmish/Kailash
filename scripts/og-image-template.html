<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG Card — Kailash Mishra</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    background: #0D0A1F;
    color: #FFF4E6;
    font-family: "Instrument Sans", Helvetica Neue, Arial, sans-serif;
    overflow: hidden;
  }
  .safe { position: absolute; inset: 60px; }
  .left { position: absolute; left: 60px; top: 140px; max-width: 620px; }
  h1 { font-size: 72px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; }
  h2 { margin-top: 28px; font-size: 36px; font-weight: 700; color: #FFD23F; letter-spacing: -0.03em; }
  p { margin-top: 22px; font-size: 28px; color: #C9BDE8; }
  .bar { margin-top: 28px; width: 120px; height: 8px; border-radius: 999px; background: #38E1FF; }
  .art { position: absolute; right: 60px; top: 50%; transform: translateY(-50%); width: 360px; height: 360px; }
  .blob { position: absolute; border-radius: 50%; }
  .b1 { width: 220px; height: 220px; background: #FF4FA3; left: 40px; top: 20px; }
  .b2 { width: 160px; height: 160px; border: 22px solid #38E1FF; background: transparent; right: 0; bottom: 40px; }
  .b3 { width: 120px; height: 120px; background: #FFD23F; left: 0; bottom: 30px; }
  .photo {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 280px;
    height: 280px;
    border-radius: 50%;
    object-fit: cover;
    border: 10px solid #FF4FA3;
  }
</style>
</head>
<body>
  <div class="safe">
    <div class="left">
      <h1>Kailash Mishra</h1>
      <h2>Lead Full-Stack Engineer</h2>
      <p>Magento · AI · SaaS · Mobile</p>
      <div class="bar"></div>
    </div>
    <div class="art">
      <span class="blob b1"></span>
      <span class="blob b2"></span>
      <span class="blob b3"></span>
      <img class="photo" src="../public/kailash.jpeg" alt="Kailash Mishra">
    </div>
  </div>
</body>
</html>
